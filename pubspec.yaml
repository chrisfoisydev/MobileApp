name: mobile_app
description: BECU mobile banking UI prototype built with Flutter.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Pure-Dart effects/animation library (no native plugin) used to
  # choreograph the layered login backdrop. three_dart was intentionally NOT
  # used: it depends on flutter_gl (a native plugin) which breaks plugin-free
  # builds.
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
