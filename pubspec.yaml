name: mobile_app
description: BECU mobile banking UI prototype built with Flutter.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Pure-Dart effects/animation library (no native plugin) used to
  # choreograph the layered login backdrop. three_dart was intentionally NOT
  # used: it depends on flutter_gl (a native plugin) which breaks plugin-free
  # builds.
  flutter_animate: ^4.5.0
  # Pure-Dart Lottie renderer (no native plugin) for the payment-success
  # celebration animation.
  lottie: ^3.0.0
  # Plays the optional drone-over-Seattle login backdrop video. (A native
  # plugin — fine for CI-built APKs and the web build.)
  video_player: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/video/
